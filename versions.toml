# Pinned versions for the whole stack.
# The sbt build and the Python tooling both read this file, so a version
# is changed here and nowhere else.
#
# Tool versions that must live in a tool's own file are not repeated here:
#   sbt       jvm/project/build.properties
#   scalafmt  jvm/.scalafmt.conf

[jvm]
# Bytecode target and the Java version of the runtime images.
java = "21"
# Must match the Scala version Spark is built with.
scala = "2.13.17"
spark = "4.1.4"
# Must match the Hadoop version Spark is built with.
hadoop = "3.4.2"
iceberg = "1.11.0"
kafka = "4.4.0"
postgres_jdbc = "42.7.14"
scalatest = "3.2.20"
testcontainers = "2.0.5"

[python]
python = "3.12"

[shared]
# Used by both XGBoost4J and the Python package. Keep them identical,
# otherwise the two sides can score the same row differently.
xgboost = "3.4.0"

[platform]
# Kubernetes on the server, and the k3s image of the local dev cluster.
k3s = "v1.37.2+k3s1"
k3d = "v5.9.0"
flux = "v2.10.0"
# Operator and Helm chart share one version.
strimzi = "1.3.1"
# The newest broker this Strimzi release can run. It may trail the client
# version under [jvm]; clients talk to older brokers without trouble.
kafka_broker = "4.3.2"

[tools]
# Used to check the manifests under deploy/.
kubeconform = "v0.8.0"

[images]
# Container images used by the integration tests and the cluster manifests.
seaweedfs = "chrislusf/seaweedfs:4.53"
postgres = "postgres:18.7-alpine"
