rules = [
  OrganizeImports,
  RemoveUnused,
  ExplicitResultTypes,
  DisableSyntax
]

# Same import groups as .scalafmt.conf, so the two tools agree on the layout.
# Sorting inside a group is left to scalafmt.
OrganizeImports {
  removeUnused = true
  groups = ["re:javax?\\.", "scala.", "*", "dev.wikiguard."]
  importsOrder = Keep
  importSelectorsOrder = Keep
  groupedImports = Keep
}

ExplicitResultTypes {
  memberVisibility = [Public]
}

DisableSyntax {
  noNulls = true
  noReturns = true
  noVars = true
  noWhileLoops = true
  noFinalize = true
  noAsInstanceOf = true
}
