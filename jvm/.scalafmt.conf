version = "3.11.5"
runner.dialect = scala213
maxColumn = 100
indent.main = 2
indent.defnSite = 4
align.preset = none
newlines.source = keep
docstrings.style = Asterisk
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers, Imports]
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [
  ["java\\..*", "javax\\..*"],
  ["scala\\..*"],
  [".*"],
  ["dev\\.wikiguard\\..*"]
]
