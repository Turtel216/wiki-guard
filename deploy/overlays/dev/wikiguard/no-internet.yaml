# Pods in this namespace may talk to other pods in the cluster and to
# nothing else. Dev must never contact Wikimedia, even by mistake.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-internet
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
