apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - statefulset.yaml
  - service.yaml
  - buckets-job.yaml
configMapGenerator:
  - name: seaweedfs-scripts
    files:
      - create-buckets.sh
generatorOptions:
  # A Job cannot be changed once created, so the name it mounts must not move.
  disableNameSuffixHash: true
