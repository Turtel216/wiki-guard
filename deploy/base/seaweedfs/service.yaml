# The S3 endpoint for everything else in the cluster: http://seaweedfs.platform:8333
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
# Gives the pod a stable DNS name for its own internal traffic and for
# admin commands. It answers before the pod is ready so SeaweedFS can find
# itself while starting.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: master
      port: 9333
    - name: master-grpc
      port: 19333
    - name: volume
      port: 8080
    - name: volume-grpc
      port: 18080
    - name: filer
      port: 8888
    - name: filer-grpc
      port: 18888
