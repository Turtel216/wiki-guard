# What Prometheus collects, and from where.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Our own services. A pod is collected when one of its containers has a
  # port named "metrics", so a new service needs no change here.
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [wikiguard, platform]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed
        action: drop
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # The job is the name of the service, such as "ingestor".
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: (.+)
        target_label: job

  # Memory and CPU of every container, read from each node's kubelet by
  # way of the API server.
  - job_name: containers
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # The kubelet offers hundreds of series per container. Keep the few
      # the dashboards use, so that Prometheus itself stays small.
      - source_labels: [__name__]
        regex: container_memory_working_set_bytes|container_spec_memory_limit_bytes|container_cpu_usage_seconds_total
        action: keep
      # Series without a container name are sums over a whole pod or node.
      - source_labels: [container]
        regex: ""
        action: drop
