apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rbac.yaml
  - statefulset.yaml
  - service.yaml
# The name gets a suffix made from the content, so a changed config
# restarts Prometheus by itself.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
