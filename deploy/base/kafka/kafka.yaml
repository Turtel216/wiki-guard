# Clients inside the cluster connect to wikiguard-kafka-bootstrap.platform:9092.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: wikiguard
spec:
  kafka:
    # Keep in step with platform.kafka_broker in versions.toml.
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Topics are created on purpose, never by a typo in a client.
      auto.create.topics.enable: false
      num.partitions: 3
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      # Seven days, the same window upstream keeps for resuming the stream.
      log.retention.hours: 168
  # Creates and updates the topics declared as KafkaTopic resources.
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 256Mi
