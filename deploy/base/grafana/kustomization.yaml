apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - service.yaml
  # The dashboards themselves, kept at the top of the repository.
  - ../../../dashboards
# The names get a suffix made from the content, so a changed file
# restarts Grafana by itself.
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboard-provider.yaml
