# Copies the Wikimedia event stream into the raw Kafka topics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
spec:
  # Exactly one, always. Upstream allows a single stream connection, so the
  # old pod must be gone before a new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ingestor
          # The overlays set the tag.
          image: ghcr.io/turtel216/wikiguard-ingestor
          env:
            - name: WG_SOURCE
              value: live
            - name: WG_KAFKA_BOOTSTRAP_SERVERS
              value: wikiguard-kafka-bootstrap.platform:9092
          ports:
            - name: metrics
              containerPort: 9400
          # Answers as long as the process is up. A stalled stream is handled
          # inside the service, which closes and reopens the connection.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: 300Mi
            limits:
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            # The Kafka client unpacks its compression library here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
