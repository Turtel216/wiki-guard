# The operator that turns Kafka resources into a running broker.
# It only watches the namespace it is installed in.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: strimzi-kafka-operator
      # Keep in step with platform.strimzi in versions.toml.
      version: 1.3.1
      sourceRef:
        kind: HelmRepository
        name: strimzi
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    resources:
      requests:
        memory: 384Mi
      limits:
        memory: 384Mi
