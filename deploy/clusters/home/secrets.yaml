# Credentials, encrypted in Git and decrypted in the cluster with the age
# key stored in the sops-age secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: operators
  interval: 10m
  path: ./deploy/overlays/prod/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
