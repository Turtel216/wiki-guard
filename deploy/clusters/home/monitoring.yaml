# Prometheus and Grafana. They only watch, so they do not wait for the
# platform or the WikiGuard services to be there.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: operators
  interval: 10m
  path: ./deploy/overlays/prod/monitoring
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
