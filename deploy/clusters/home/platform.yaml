apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  dependsOn:
    - name: operators
    - name: secrets
  interval: 10m
  path: ./deploy/overlays/prod/platform
  prune: true
  wait: true
  # The first Kafka start pulls large images.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
