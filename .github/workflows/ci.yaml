name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt --batch scalafmtCheckAll scalafmtSbtCheck
      - name: Check lint rules
        run: sbt --batch "scalafixAll --check"
      - name: Run tests
        run: sbt --batch test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Check lint rules and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Check types
        run: uv run mypy
      - name: Run tests
        run: uv run pytest
