name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    env:
      WG_PARITY_DIR: ${{ github.workspace }}/jvm/target/parity
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v5
      - name: Check formatting
        run: sbt --batch scalafmtCheckAll integration/scalafmtCheckAll scalafmtSbtCheck
      - name: Check lint rules
        run: sbt --batch "scalafixAll --check" "integration/scalafixAll --check"
      - name: Train the parity model in Python
        working-directory: ml
        run: |
          uv sync --locked
          uv run python -m wikiguard_ml.parity "$WG_PARITY_DIR"
      - name: Run tests
        run: sbt --batch test

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run integration tests
        run: sbt --batch integration/test

  # Images are built for every change and published only from main.
  images:
    needs: [jvm, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build the ingestor image
        run: make image-ingestor IMAGE_TAG=${{ github.sha }}
      - name: Publish the ingestor image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/turtel216/wikiguard-ingestor:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          . scripts/lib.sh
          version="$(pinned tools.kubeconform)"
          curl -sfL "https://github.com/yannh/kubeconform/releases/download/$version/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Check the deploy manifests
        run: scripts/validate-deploy.sh

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Check lint rules and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Check types
        run: uv run mypy
      - name: Run tests
        run: uv run pytest
